version: v2
plugins:
  - local: protoc-gen-ts
    out: src/generated
    opt:
      - client_generic
      - generate_dependencies
inputs:
  - directory: proto
  # The error model every refusal carries (google.rpc.Status in the
  # grpc-status-details-bin trailer): the page reads ErrorInfo's reason from
  # it. Pinned to the googleapis commit of proto/buf.lock.
  - module: buf.build/googleapis/googleapis:536964a08a534d51b8f30f2d6751f1f9
    paths:
      - google/rpc/status.proto
      - google/rpc/error_details.proto
