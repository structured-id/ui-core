# Release: release-please keeps a release PR with the next version and
# CHANGELOG from conventional commits; merging it tags vX.Y.Z, creates the
# GitHub release, and the publish job then publishes that version to npm.
#
# Each package releases on its own: @structured-id/ui-core (repository root,
# tags vX.Y.Z) and @structured-id/ui-admin (apps/ui-admin, tags
# ui-admin-vX.Y.Z). A package is published when the version its manifest
# entry names is tagged and not on npm yet: in the run that created the
# release, and in any later run if that one never reached publishing.
# Each has its own release PR, whose branch names the package: a PR shared
# by both is not released when only the root package changed, because
# release-please then reads it as a single release and requires the branch
# to name its component.
#
# npm trusted publishing (OIDC) is configured for this workflow file and the
# `release` environment, per package:
#   npmjs.com → <package> → Settings → Trusted Publishers
#     Org: structured-id, Repo: ui-core, Workflow: release.yml,
#     Environment: release

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag of each package's current version when it is tagged and npm does
  # not have it; empty otherwise. Runs after release-please, so a release
  # created in this run is seen.
  pending:
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pending.outputs.tag }}
      admin-tag: ${{ steps.pending.outputs.admin-tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find tagged versions npm does not have
        id: pending
        run: |
          pending() {
            local output="$1" package_dir="$2" tag_prefix="$3" manifest_key="$4"
            local name version tag
            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./.release-please-manifest.json')['${manifest_key}']")"
            tag="${tag_prefix}${version}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "${name}@${version}: ${tag} is not tagged; nothing to publish."
              return
            fi
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; nothing to do."
              return
            fi
            echo "${name}@${version} is tagged ${tag} and not on npm."
            echo "${output}=${tag}" >> "${GITHUB_OUTPUT}"
          }
          pending tag . v .
          pending admin-tag apps/ui-admin ui-admin-v apps/ui-admin

  publish:
    needs: pending
    if: needs.pending.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release # required for npm OIDC trusted publishing
    permissions:
      contents: read
      id-token: write # npm provenance + OIDC
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pending.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          # NO registry-url: it writes an .npmrc whose NODE_AUTH_TOKEN
          # placeholder overrides OIDC trusted publishing.

      - name: Enable Corepack
        run: corepack enable

      - name: Install Yarn (the version in package.json packageManager)
        run: corepack install

      - name: Install dependencies
        run: yarn install --immutable

      # The package ships its TypeScript and Vue sources; the consuming
      # application's bundler compiles them.
      - name: Publish to npm
        env:
          TAG: ${{ needs.pending.outputs.tag }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PV="$(node -p "require('./package.json').version")"
          if [ "${PV}" != "${TAG#v}" ]; then
            echo "Release tag ${TAG} does not match package.json version ${PV}."
            exit 1
          fi
          if npm view "${NAME}@${PV}" version >/dev/null 2>&1; then
            echo "${NAME}@${PV} is already published; nothing to do."
            exit 0
          fi
          npm publish --provenance --access public

  # After the root package's job, whichever way it ended: the console's
  # archive requires the root package's current version.
  publish-ui-admin:
    needs: [pending, publish]
    if: ${{ !cancelled() && needs.publish.result != 'failure' && needs.pending.outputs.admin-tag != '' }}
    runs-on: ubuntu-latest
    environment: release # required for npm OIDC trusted publishing
    permissions:
      contents: read
      id-token: write # npm provenance + OIDC
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pending.outputs.admin-tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Yarn (the version in package.json packageManager)
        run: corepack install

      - name: Install dependencies
        run: yarn install --immutable

      # yarn pack resolves the workspace dependency on ui-core to its
      # released version range; npm publishes that archive.
      - name: Publish to npm
        working-directory: apps/ui-admin
        env:
          TAG: ${{ needs.pending.outputs.admin-tag }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PV="$(node -p "require('./package.json').version")"
          if [ "${PV}" != "${TAG#ui-admin-v}" ]; then
            echo "Release tag ${TAG} does not match package.json version ${PV}."
            exit 1
          fi
          if npm view "${NAME}@${PV}" version >/dev/null 2>&1; then
            echo "${NAME}@${PV} is already published; nothing to do."
            exit 0
          fi
          yarn pack --out package.tgz
          npm publish package.tgz --provenance --access public
