# Release: release-please keeps a release PR with the next version and
# CHANGELOG from conventional commits; merging it tags vX.Y.Z, creates the
# GitHub release, and the publish job then publishes that version to npm.
#
# npm trusted publishing (OIDC) is configured for this workflow file and the
# `release` environment:
#   npmjs.com → @structured-id/ui-core → Settings → Trusted Publishers
#     Org: structured-id, Repo: ui-core, Workflow: release.yml,
#     Environment: release

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: release # required for npm OIDC trusted publishing
    permissions:
      contents: read
      id-token: write # npm provenance + OIDC
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # NO registry-url: it writes an .npmrc whose NODE_AUTH_TOKEN
          # placeholder overrides OIDC trusted publishing.

      - name: Enable Corepack
        run: corepack enable

      - name: Install Yarn (the version in package.json packageManager)
        run: corepack install

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate proto clients
        run: yarn generate

      # The package ships its TypeScript and Vue sources; the consuming
      # application's bundler compiles them.
      - name: Publish to npm
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PV="$(node -p "require('./package.json').version")"
          if [ "${PV}" != "${TAG#v}" ]; then
            echo "Release tag ${TAG} does not match package.json version ${PV}."
            exit 1
          fi
          if npm view "${NAME}@${PV}" version >/dev/null 2>&1; then
            echo "${NAME}@${PV} is already published; nothing to do."
            exit 0
          fi
          npm publish --provenance --access public
